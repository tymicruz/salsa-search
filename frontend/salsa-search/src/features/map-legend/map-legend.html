<div class="rounded-lg bg-white/90 shadow-md p-3 text-xs text-[#3c4043]">
  @for (style of styles; track style.letter) {
    <div class="flex items-center gap-2 mb-1">
      <span class="flex items-center justify-center size-5 rounded-full text-[9px] font-bold text-white" [style.background]="style.color">
        {{ style.letter }}
      </span>
      {{ style.label }}
    </div>
  }
  @if (unconfirmedCount()) {
    <label class="flex items-center gap-2 mt-2 pt-2 border-t border-gray-200 cursor-pointer">
      <input type="checkbox" [checked]="showUnconfirmed()" (change)="showUnconfirmed.set(!showUnconfirmed())" />
      Show grey places ({{ unconfirmedCount() }})
    </label>
  }
</div>
